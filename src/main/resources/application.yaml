# Profiles: (default/dev) DevTools aktif | prod -> application-prod.yaml (DevTools & Swagger OFF, aktifkan via SPRING_PROFILES_ACTIVE=prod)
spring:
  application:
    name: springchat-chat

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springchat}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

    hikari:
      pool-name: springchat-hikari
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000 # ms -> gagal cepat, jangan antrikan request lama
      idle-timeout: 600000 # 10 menit
      max-lifetime: 1740000 # 29 menit, harus < timeout NAT/LB/PostgreSQL

  # ---------------------------------- JPA -----------------------------------
  jpa:
    open-in-view: false
    show-sql: false # jangan print SQL ke log produksi
    hibernate:
      ddl-auto: validate # skema = milik Flyway; Hibernate hanya memvalidasi
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # selaras dengan kolom TIMESTAMPTZ + java.time.Instant

  # --------------------------------- Flyway ---------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration

  # --------------------------------- Jackson --------------------------------
  # Tidak perlu konfigurasi: Jackson 3 (Boot 4) sudah menulis tanggal/jam
  # sebagai ISO-8601 (mis. "2026-10-18T05:00:00Z"), bukan array epoch.

  # --------------------------- Pagination (Spring Data) ---------------------
  data:
    web:
      pageable:
        default-page-size: 20 # default halaman kalau klien tidak kirim ?size=
        max-page-size: 100 # batas atas -> cegah ?size=1000000

  # ------------------------- Graceful shutdown timing -----------------------
  lifecycle:
    timeout-per-shutdown-phase: 20s # beri waktu in-flight request selesai saat stop

# --------------------------------- HTTP Server --------------------------------
springchat:
  security:
    jwt:
      # Development-only fallback. Set JWT_SECRET to a random value of at least 32 bytes.
      secret: ${JWT_SECRET:local-development-only-key-change-before-deploy-2026}
      issuer: ${JWT_ISSUER:springchat}
      access-ttl: PT15M
    cookie-secure: ${COOKIE_SECURE:false}
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

server:
  port: ${SERVER_PORT:8080} # eksplisit, jangan mengandalkan default tersembunyi
  forward-headers-strategy: framework
  shutdown: graceful # drain koneksi dengan rapi saat aplikasi di-stop
  compression:
    enabled: true # gzip untuk response cukup besar
    mime-types: application/json,text/html,text/plain
    min-response-size: 1024

